
spring.application.name=SmartPark

spring.datasource.url=${SMARTPARK_DB_URL:jdbc:mysql://localhost:3306/smartpark}
spring.datasource.username=${SMARTPARK_DB_USERNAME:root}
spring.datasource.password=${SMARTPARK_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.connectTimeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

smartpark.jwt.secret=${SMARTPARK_JWT_SECRET:}
smartpark.jwt.expiration=PT30M
smartpark.cors.allowed-origins=${SMARTPARK_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500}

server.port=8080

spring.mail.host=${SMARTPARK_MAIL_HOST:localhost}
spring.mail.port=${SMARTPARK_MAIL_PORT:587}
spring.mail.username=${SMARTPARK_MAIL_USERNAME:}
spring.mail.password=${SMARTPARK_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMARTPARK_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMARTPARK_MAIL_STARTTLS:true}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
smartpark.kyc.storage-directory=${SMARTPARK_KYC_STORAGE_DIRECTORY:${user.home}/.smartpark/kyc}
smartpark.mail.from=${SMARTPARK_MAIL_FROM:noreply@smartpark.local}
smartpark.frontend.reset-url=${SMARTPARK_RESET_URL:http://127.0.0.1:5173/forgot-password}
smartpark.razorpay.key-id=${SMARTPARK_RAZORPAY_KEY_ID:}
smartpark.razorpay.key-secret=${SMARTPARK_RAZORPAY_KEY_SECRET:}
smartpark.razorpay.mode=${SMARTPARK_RAZORPAY_MODE:test}
smartpark.razorpay.webhook-secret=${SMARTPARK_RAZORPAY_WEBHOOK_SECRET:}
smartpark.geocoding.contact=${SMARTPARK_GEOCODER_CONTACT:}
