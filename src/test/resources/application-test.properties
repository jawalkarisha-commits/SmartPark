spring.datasource.url=jdbc:h2:mem:smartpark-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=false
spring.sql.init.mode=always
smartpark.jwt.secret=${random.uuid}${random.uuid}
smartpark.auth.expose-verification-codes=false
spring.mail.host=${SMARTPARK_MAIL_HOST:localhost}
spring.mail.port=${SMARTPARK_MAIL_PORT:2525}
spring.mail.username=${SMARTPARK_MAIL_USERNAME:}
spring.mail.password=${SMARTPARK_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMARTPARK_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMARTPARK_MAIL_STARTTLS:false}
smartpark.kyc.storage-directory=${java.io.tmpdir}/smartpark-test-kyc
smartpark.frontend.reset-url=http://localhost:5173/forgot-password
